name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.13"]   # Raspberry Pi OS Bookworm and Trixie
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          pip install -r requirements.txt --no-deps
          pip install numpy opencv-python-headless pillow pytest httpx ruff
      - name: Lint
        run: ruff check pirdfy tests
      - name: Test
        run: pytest

  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning install.sh deploy/pirdfy-cli
