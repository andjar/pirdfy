# Builds the ONNX detection model once and publishes it as a release asset, so
# installs download ~13 MB instead of building it on the Pi (~10 minutes).
# Run manually: Actions -> Build model -> Run workflow.
#
# Note: YOLOv8 weights are licensed AGPL-3.0 by Ultralytics. Publishing the
# exported file is redistribution; make sure that suits you before running this.
name: Build model

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Ultralytics model name"
        default: yolov8n
      tag:
        description: "Release tag that install.sh downloads from"
        default: models-v1

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Export to ONNX (384x640, matches the camera's 16:9 lores stream)
        run: |
          pip install ultralytics onnx onnxslim onnxruntime
          python - <<'EOF'
          from ultralytics import YOLO
          YOLO("${{ inputs.model }}.pt").export(format="onnx", imgsz=(384, 640), opset=17, simplify=True, dynamic=False)
          EOF
          sha256sum ${{ inputs.model }}.onnx > ${{ inputs.model }}.onnx.sha256
          python -c "import onnxruntime as o; s=o.InferenceSession('${{ inputs.model }}.onnx'); print(s.get_inputs()[0].shape)"
      - name: Publish release asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ inputs.tag }}" -R "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create "${{ inputs.tag }}" -R "${{ github.repository }}" --title "Detection models" \
              --notes "ONNX models used by install.sh. Not a Pirdfy release." --prerelease
          gh release upload "${{ inputs.tag }}" -R "${{ github.repository }}" --clobber \
            ${{ inputs.model }}.onnx ${{ inputs.model }}.onnx.sha256
