[project]
name = "pirdfy"
dynamic = ["version"]
description = "Bird feeder camera detector for Raspberry Pi 5"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
# numpy, opencv, Pillow and picamera2 come from Raspberry Pi OS (apt) so they
# match libcamera; they are deliberately not listed here.
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "onnxruntime>=1.20",
    "apprise>=1.9",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "numpy", "opencv-python-headless", "pillow"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
include = ["pirdfy*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
